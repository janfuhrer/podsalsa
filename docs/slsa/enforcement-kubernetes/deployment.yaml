apiVersion: apps/v1
kind: Deployment
metadata:
  name: podsalsa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: podsalsa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podsalsa
    spec:
      containers:
      - image: ghcr.io/janfuhrer/podsalsa:v0.10.0@sha256:65606217333fd07b7ae7964569fb2adc4c9e91ffdd935c66682319d0bd83dc1c
        imagePullPolicy: Always
        name: podsalsa
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        ports:
        - containerPort: 8080
          name: http
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
