apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-slsa-provenance-keyless
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  rules:
  - name: check-slsa-keyless
    match:
      any:
      # resources to apply the policy to
      # "Pod" includes many higher-level controller like Deployment, StatefulSet, DaemonSet, etc.
      # see Auto-Gen Rules: https://kyverno.io/docs/writing-policies/autogen/
      - resources:
          kinds:
          - Pod
    verifyImages:
    # Each verifyImages rule can be used to verify signatures or attestations, but not both
    # use "verifyImages[*].attestors" (for image signature) or "verifyImages[*].attestations.attestors" (for attestation signature)
    #
    # "SigstoreBundle" (not "Cosign") is required to read GitHub Artifact
    # Attestations: they are stored as a Sigstore bundle OCI referrer, which only
    # this verifier path understands.
    - type: SigstoreBundle
      # enforces that all matching images are verified (default: true)
      required: true
      # converts tags to digests for matching images (default: true)
      mutateDigest: true
      # enforces that digest are used for matching images (default: true)
      verifyDigest: true
      # Kyverno caches successful verified images by default (default: true)
      useCache: true
      # which images to verify
      imageReferences:
      - "ghcr.io/janfuhrer/podsalsa*"
      # note: no "repository" field is set. Since v0.9.0 the provenance is stored
      # as an OCI 1.1 referrer next to the image itself, not in a side repository.
      # check attestation of image
      attestations:
      # SLSA v1 build provenance, as generated by GitHub Artifact Attestations
      - type: https://slsa.dev/provenance/v1
        # check signature of attestation
        attestors:
        - count: 1 # required count of attestors in the list
          entries:
          # The signer is the reusable workflow that built the image, not the
          # release workflow that called it. That separation is the SLSA Build
          # L3 isolation boundary.
          #
          # "subjectRegExp" is required here: on the SigstoreBundle path
          # "subject" is an exact string match, so a "v*" glob would never fire.
          # The expression is anchored at both ends because matching is
          # unanchored by default. Both issuer and subject must be set, or no
          # identity check is performed at all.
          - keyless:
              subjectRegExp: '^https://github\.com/janfuhrer/podsalsa/\.github/workflows/build-image\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'
              issuer: "https://token.actions.githubusercontent.com"
              rekor:
                url: https://rekor.sigstore.dev
        # verify content of the predicate section in the payload of the attestation (according to the policy.cue)
        conditions:
        - all:
          # the provenance must have been signed by the trusted builder
          - key: "{{ regex_match('^https://github.com/janfuhrer/podsalsa/.github/workflows/build-image.yml@refs/tags/v[0-9]+.[0-9]+.[0-9]+(-rc.[0-9]+)?$','{{ runDetails.builder.id }}') }}"
            operator: Equals
            value: true
          # the build must describe a GitHub Actions workflow run
          - key: "{{ buildDefinition.buildType }}"
            operator: Equals
            value: "https://actions.github.io/buildtypes/workflow/v1"
          # the image must have been built from this source repository
          - key: "{{ buildDefinition.externalParameters.workflow.repository }}"
            operator: Equals
            value: "https://github.com/janfuhrer/podsalsa"
          # triggered by a version tag, not a branch
          - key: "{{ regex_match('^refs/tags/v[0-9]+.[0-9]+.[0-9]+(-rc.[0-9]+)?$','{{ buildDefinition.externalParameters.workflow.ref }}') }}"
            operator: Equals
            value: true
          # entered through the release workflow
          - key: "{{ buildDefinition.externalParameters.workflow.path }}"
            operator: Equals
            value: ".github/workflows/release.yml"
          # built on a GitHub-hosted runner
          - key: "{{ buildDefinition.internalParameters.github.runner_environment }}"
            operator: Equals
            value: "github-hosted"
