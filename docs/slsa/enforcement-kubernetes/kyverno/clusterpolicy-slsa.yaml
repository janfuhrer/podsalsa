apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-slsa-provenance-keyless
  annotations:
    policies.kyverno.io/title: Verify SLSA provenance (keyless)
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.19.0
    policies.kyverno.io/description: >-
      Verifies that podsalsa images carry SLSA v1 build provenance signed by the
      trusted builder (build-image.yml), and that the provenance describes a
      release built from a version tag on a GitHub-hosted runner.
spec:
  # verifyImages reaches out to the registry and to Rekor. Keep it to admission
  # only, so background scans do not repeatedly re-verify existing pods.
  background: false
  webhookConfiguration:
    # spec.webhookTimeoutSeconds is deprecated in favour of this field
    timeoutSeconds: 30
  rules:
  - name: check-slsa-keyless
    match:
      any:
      # "Pod" also covers higher-level controllers such as Deployment,
      # StatefulSet and DaemonSet, see https://kyverno.io/docs/writing-policies/autogen/
      - resources:
          kinds:
          - Pod
    verifyImages:
    # GitHub Artifact Attestations are stored as a Sigstore bundle OCI referrer.
    # Only the "SigstoreBundle" verifier reads that format — with the default
    # "Cosign" type the attestation is not found at all.
    - type: SigstoreBundle
      # per-rule action; spec.validationFailureAction is deprecated
      failureAction: Enforce
      # every matching image must verify, none may be skipped
      required: true
      # resolve tags to digests, and reject images that are not digest-pinned
      mutateDigest: true
      verifyDigest: true
      # cache successful verifications (default: true)
      useCache: true
      imageReferences:
      - "ghcr.io/janfuhrer/podsalsa*"
      # No "repository" field: since v0.9.0 the provenance lives as an OCI 1.1
      # referrer next to the image itself, not in a separate side repository.
      attestations:
      # SLSA v1 build provenance, as produced by GitHub Artifact Attestations.
      # "predicateType" is deprecated in favour of "type".
      - type: https://slsa.dev/provenance/v1
        attestors:
        - count: 1
          entries:
          # The signer is the reusable workflow that built the image, not the
          # release workflow that called it — that separation is what makes the
          # provenance SLSA Build L3.
          #
          # "subjectRegExp" is required here: on the SigstoreBundle path
          # "subject" is an exact string match, so a "v*" glob would never fire.
          # Anchor both ends, because matching is otherwise unanchored. Both
          # issuer and subject must be set or no identity check is performed.
          - keyless:
              subjectRegExp: '^https://github\.com/janfuhrer/podsalsa/\.github/workflows/build-image\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'
              issuer: "https://token.actions.githubusercontent.com"
              rekor:
                url: https://rekor.sigstore.dev
        # Content policy, mirroring policy.cue. Note the variable context is
        # rooted at the PREDICATE, so write "buildDefinition.*" and not
        # "predicate.buildDefinition.*".
        conditions:
        - all:
          # signed by the trusted builder
          - key: "{{ regex_match('^https://github\\.com/janfuhrer/podsalsa/\\.github/workflows/build-image\\.yml@refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+(-rc\\.[0-9]+)?$','{{ runDetails.builder.id }}') }}"
            operator: Equals
            value: true
          # produced by a GitHub Actions workflow run
          - key: "{{ buildDefinition.buildType }}"
            operator: Equals
            value: "https://actions.github.io/buildtypes/workflow/v1"
          # built from this source repository
          - key: "{{ buildDefinition.externalParameters.workflow.repository }}"
            operator: Equals
            value: "https://github.com/janfuhrer/podsalsa"
          # triggered by a version tag, not a branch
          - key: "{{ regex_match('^refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+(-rc\\.[0-9]+)?$','{{ buildDefinition.externalParameters.workflow.ref }}') }}"
            operator: Equals
            value: true
          # entered through the release workflow
          - key: "{{ buildDefinition.externalParameters.workflow.path }}"
            operator: Equals
            value: ".github/workflows/release.yml"
          # built on GitHub-hosted infrastructure
          - key: "{{ buildDefinition.internalParameters.github.runner_environment }}"
            operator: Equals
            value: "github-hosted"
