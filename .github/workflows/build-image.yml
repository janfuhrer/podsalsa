name: build-image

# Trusted builder for the container images.
#
# Like build-binaries.yml, this workflow performs the build and signs the
# provenance itself, and takes no inputs from the caller. The attestation is
# pushed to the registry as an OCI 1.1 referrer next to the image, so the
# provenance travels with the image rather than living only on the release page.
#
# Verify the resulting image with:
#   gh attestation verify oci://ghcr.io/janfuhrer/podsalsa@<digest> \
#     --repo janfuhrer/podsalsa \
#     --signer-workflow janfuhrer/podsalsa/.github/workflows/build-image.yml

on:
  workflow_call:
    outputs:
      digest:
        description: Digest of the published multi-arch image
        value: ${{ jobs.build.outputs.digest }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.release-podsalsa.outputs.digest }}
    permissions:
      contents: read
      packages: write # push the image and the provenance attestation to ghcr.io
      id-token: write # mint the OIDC token used for keyless signing
      attestations: write # persist the provenance attestation
      artifact-metadata: write # create the storage record for the pushed attestation
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Publish podsalsa
        id: release-podsalsa
        uses: ./.github/actions/publish-image
        with:
          makefile-target: ko-publish-podsalsa
          registry: ghcr.io
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository_owner }}
          version: ${{ github.ref_name }}
          sign-image: true
          sbom-name: podsalsa
          main-path: ./

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/podsalsa
          subject-digest: ${{ steps.release-podsalsa.outputs.digest }}
          push-to-registry: true
