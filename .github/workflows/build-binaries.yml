name: build-binaries

# Trusted builder for the Go binary archives.
#
# This workflow is the SLSA build platform for the release artifacts: the build
# and the provenance signing both happen here. `workflow_call` accepts no
# inputs, so the caller cannot influence what is built or what the provenance
# says. That isolation is what makes the resulting provenance SLSA Build L3 —
# the signer identity recorded in the attestation is this file, not release.yml.
#
# Verify the resulting artifacts with:
#   gh attestation verify <artifact> \
#     --repo janfuhrer/podsalsa \
#     --signer-workflow janfuhrer/podsalsa/.github/workflows/build-binaries.yml

on:
  workflow_call:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release and upload the assets
      id-token: write # mint the OIDC token used for keyless signing
      attestations: write # persist the provenance attestation
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: false

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate checksums file
        id: checksums
        env:
          ARTIFACTS: "${{ steps.goreleaser.outputs.artifacts }}"
        run: |
          set -euo pipefail
          checksum_file=$(echo "$ARTIFACTS" | jq -r '.[] | select (.type=="Checksum") | .path')
          echo "path=$checksum_file" >> "$GITHUB_OUTPUT"

      # The checksums file already lists every released archive and SBOM, so
      # attesting it covers all of them in a single provenance statement.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ steps.checksums.outputs.path }}
