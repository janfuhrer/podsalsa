# OpenSSF Security Insights, https://github.com/ossf/security-insights-spec
header:
  schema-version: 2.2.0
  last-updated: '2026-09-11'
  last-reviewed: '2026-09-11'
  url: https://github.com/janfuhrer/podsalsa/blob/main/SECURITY-INSIGHTS.yml
  comment: |
    PodSalsa is a reference implementation for releasing a Go application with
    SLSA Build Level 3 provenance. Security tooling is therefore a core part of
    the project rather than an add-on.

project:
  name: PodSalsa
  homepage: https://github.com/janfuhrer/podsalsa
  administrators:
    - name: Jan Fuhrer
      email: janfuhrer@mailbox.org
      primary: true
  documentation:
    detailed-guide: https://github.com/janfuhrer/podsalsa/blob/main/docs/README.md
    code-of-conduct: https://github.com/janfuhrer/podsalsa/blob/main/CODE_OF_CONDUCT.md
    release-process: https://github.com/janfuhrer/podsalsa/blob/main/.github/workflows/README.md#release
    signature-verification: https://github.com/janfuhrer/podsalsa/blob/main/SECURITY.md#release-verification
  repositories:
    - name: podsalsa
      url: https://github.com/janfuhrer/podsalsa
      comment: |
        The only repository of this project.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    contact:
      name: Jan Fuhrer
      email: janfuhrer@mailbox.org
      primary: true
    policy: https://github.com/janfuhrer/podsalsa/blob/main/SECURITY.md
    comment: |
      Report security vulnerabilities via the GitHub Security Advisory
      "Report a Vulnerability" tab of this repository.

repository:
  url: https://github.com/janfuhrer/podsalsa
  status: active
  bug-fixes-only: false
  accepts-change-request: true
  accepts-automated-change-request: true
  no-third-party-packages: false
  core-team:
    - name: Jan Fuhrer
      email: janfuhrer@mailbox.org
      primary: true
  documentation:
    contributing-guide: https://github.com/janfuhrer/podsalsa/blob/main/CONTRIBUTING.md
    security-policy: https://github.com/janfuhrer/podsalsa/blob/main/SECURITY.md
    dependency-management-policy: https://github.com/janfuhrer/podsalsa/blob/main/.github/dependabot.yml
  license:
    url: https://github.com/janfuhrer/podsalsa/blob/main/LICENSE
    expression: Apache-2.0
  release:
    changelog: https://github.com/janfuhrer/podsalsa/releases/tag/{version}
    automated-pipeline: true
    distribution-points:
      - uri: https://github.com/janfuhrer/podsalsa/releases
        comment: "GitHub release page: Go-binary archives, SBOMs and checksums"
      - uri: pkg:oci/podsalsa?repository_url=ghcr.io/janfuhrer
        comment: Multi-architecture container images on the GitHub Container Registry
    attestations:
      - name: SLSA Build Provenance
        predicate-uri: https://slsa.dev/provenance/v1
        location: https://github.com/janfuhrer/podsalsa/blob/main/SECURITY.md#release-verification
        comment: |
          SLSA Build Level 3 provenance, generated by GitHub Artifact Attestations from
          dedicated trusted-builder workflows and verified with "gh attestation verify".
          Container provenance is additionally stored as an OCI 1.1 referrer next to the image.
      - name: CycloneDX SBOM
        predicate-uri: https://cyclonedx.org/bom
        location: https://github.com/janfuhrer/podsalsa/blob/main/SECURITY.md#sboms
        comment: |
          SBOMs are published for both the Go-binary archives and the container images.
          The container SBOM is attested with cosign and stored as an OCI 1.1 referrer.
    license:
      url: https://github.com/janfuhrer/podsalsa/blob/main/LICENSE
      expression: Apache-2.0
  security:
    champions:
      - name: Jan Fuhrer
        email: janfuhrer@mailbox.org
        primary: true
    tools:
      - name: CodeQL
        type: SAST
        version: latest
        rulesets:
          - default
        integration:
          adhoc: false
          ci: true
          release: false
        comment: |
          Semantic code analysis on push, pull request and weekly. Results are uploaded
          as SARIF to the repository Security tab.
      - name: gosec
        type: SAST
        version: latest
        rulesets:
          - default
        integration:
          adhoc: false
          ci: true
          release: false
        comment: |
          Go-specific static security analysis on every push and pull request.
      - name: golangci-lint
        type: SAST
        version: latest
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        comment: |
          Aggregated Go linters, run in CI and as a local pre-commit hook via prek.
      - name: go test -fuzz
        type: fuzzing
        version: latest
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        comment: |
          Native Go fuzzing of the HTTP handlers, run briefly on every pull request and
          for a longer period on a weekly schedule. Seed corpus lives in testdata/.
      - name: Dependabot
        type: SCA
        version: latest
        rulesets:
          - default
        integration:
          adhoc: false
          ci: true
          release: false
        comment: |
          Weekly dependency updates for Go modules, GitHub Actions and Docker.
      - name: OSV-Scanner
        type: SCA
        version: latest
        rulesets:
          - default
        integration:
          adhoc: false
          ci: true
          release: false
        comment: |
          Scans dependencies against the OSV database on push, pull request and weekly.
          Results are uploaded as SARIF to the repository Security tab.
      - name: Dependency Review
        type: SCA
        version: latest
        rulesets:
          - default
        integration:
          adhoc: false
          ci: true
          release: false
        comment: |
          Blocks pull requests that introduce known-vulnerable or disallowed-license
          dependencies.
      - name: FOSSA
        type: SCA
        version: latest
        rulesets:
          - default
        integration:
          adhoc: false
          ci: true
          release: false
        comment: |
          License compliance and dependency vulnerability analysis.
      - name: gitleaks
        type: secret
        version: latest
        rulesets:
          - default
        integration:
          adhoc: true
          ci: false
          release: false
        comment: |
          Secret scanning as a local pre-commit hook via prek. GitHub secret scanning
          and push protection are enabled on the repository itself.
      - name: OpenSSF Scorecard
        type: other
        version: latest
        rulesets:
          - default
        integration:
          adhoc: false
          ci: true
          release: false
        comment: |
          Supply-chain security scoring on push to main and weekly. Results are uploaded
          as SARIF and published to the OpenSSF Scorecard viewer.
